<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Expense Tracker</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-dark bg-dark">
        <div class="container">
          <span class="navbar-brand mb-0 h1"> Expense Tracker </span>

          <button type="button" id="themeToggle" class="btn btn-outline-light">
            Dark Mode
          </button>
        </div>
      </nav>
    </header>

    <main class="container py-4">
      <section class="page-header">
        <h1>My Expenses</h1>

        <p class="text-muted">Track and manage your expenses.</p>
      </section>

      <div id="alertContainer"></div>

      <section class="summary-grid">
        <div class="card shadow-sm summary-card">
          <div class="card-body">
            <h6 class="text-muted">Total Amount</h6>

            <h2 id="totalAmount">$0.00</h2>
          </div>
        </div>

        <div class="card shadow-sm summary-card">
          <div class="card-body">
            <h6 class="text-muted">Number of Expenses</h6>

            <h2 id="expenseCount">0</h2>
          </div>
        </div>

        <div class="card shadow-sm summary-card">
          <div class="card-body">
            <h6 class="text-muted">Highest Expense</h6>

            <h2 id="highestExpense">$0.00</h2>
          </div>
        </div>
      </section>

      <section class="card shadow-sm mb-4">
        <div class="card-header">
          <h4 class="mb-0">Add Expense</h4>
        </div>

        <div class="card-body">
          <form id="expenseForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="title" class="form-label"> Title </label>

                <input type="text" id="title" class="form-control" required />
              </div>

              <div class="col-md-6">
                <label for="amount" class="form-label"> Amount </label>

                <input
                  type="number"
                  id="amount"
                  class="form-control"
                  step="0.01"
                  min="0.01"
                  required
                />
              </div>

              <div class="col-md-6">
                <label for="category" class="form-label"> Category </label>

                <select id="category" class="form-select" required>
                  <option value="">Select category</option>

                  <option value="Food">Food</option>

                  <option value="Transport">Transport</option>

                  <option value="Bills">Bills</option>

                  <option value="Entertainment">Entertainment</option>

                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="date" class="form-label"> Date </label>

                <input type="date" id="date" class="form-control" required />
              </div>

              <div class="col-12">
                <button type="submit" class="btn btn-primary">
                  Add Expense
                </button>
              </div>
            </div>
          </form>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-header">
          <div class="expenses-header">
            <h4 class="mb-0">Expenses</h4>

            <div class="filters">
              <input
                type="search"
                id="searchInput"
                class="form-control"
                placeholder="Search by title..."
              />

              <select id="categoryFilter" class="form-select">
                <option value="All">All</option>

                <option value="Food">Food</option>

                <option value="Transport">Transport</option>

                <option value="Bills">Bills</option>

                <option value="Entertainment">Entertainment</option>

                <option value="Other">Other</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card-body">
          <div
            id="loadingSpinner"
            class="loading-container text-center py-4 d-none"
          >
            <div class="spinner-border" role="status">
              <span class="visually-hidden"> Loading... </span>
            </div>

            <p class="mt-2 mb-0">Loading expenses...</p>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>Title</th>

                  <th>Amount</th>

                  <th>Category</th>

                  <th>Date</th>

                  <th>Actions</th>
                </tr>
              </thead>

              <tbody id="expenseTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p class="footer-text">Expense Tracker &copy; 2026</p>
      </div>
    </footer>

    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Expense</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <form id="editForm">
              <input type="hidden" id="editId" />

              <div class="mb-3">
                <label for="editTitle" class="form-label"> Title </label>

                <input
                  type="text"
                  id="editTitle"
                  class="form-control"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="editAmount" class="form-label"> Amount </label>

                <input
                  type="number"
                  id="editAmount"
                  class="form-control"
                  step="0.01"
                  min="0.01"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="editCategory" class="form-label"> Category </label>

                <select id="editCategory" class="form-select" required>
                  <option value="Food">Food</option>

                  <option value="Transport">Transport</option>

                  <option value="Bills">Bills</option>

                  <option value="Entertainment">Entertainment</option>

                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="editDate" class="form-label"> Date </label>

                <input
                  type="date"
                  id="editDate"
                  class="form-control"
                  required
                />
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button type="submit" form="editForm" class="btn btn-primary">
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/app.js"></script>
  </body>
</html>
